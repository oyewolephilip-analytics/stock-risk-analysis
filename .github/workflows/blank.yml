name: Fixed Stock ETL
on:
  workflow_dispatch: # This lets you click "Run" manually to test
  schedule:
    - cron: '0 9 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ALL Dependencies
        # We add 'matplotlib' and 'openpyxl' here to fix the error
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib yfinance pyarrow openpyxl sqlalchemy pymysql

      - name: Run ETL Script
        # REPLACE 'your_script.py' with your EXACT filename below
        run: python stock_risk_analysis.py 
name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add risk_summary.csv
          git commit -m "Auto-update risk data" || exit 0
          git push
